name: Deploy web app (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add hand-tracking model and runtime
        run: |
          npm install --no-audit --no-fund
          mkdir -p www/mediapipe/tasks/wasm www/mediapipe/hands
          cp node_modules/@mediapipe/tasks-vision/vision_bundle.js www/mediapipe/tasks/
          cp node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_internal.* node_modules/@mediapipe/tasks-vision/wasm/vision_wasm_nosimd_internal.* www/mediapipe/tasks/wasm/
          curl -fsSL --retry 3 --connect-timeout 20 -o www/mediapipe/tasks/hand_landmarker.task "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" || true
          if [ "$(stat -c%s www/mediapipe/tasks/hand_landmarker.task 2>/dev/null || echo 0)" -gt 1000000 ]; then
            echo "Using the MediaPipe Tasks (GPU) hand engine"
          else
            echo "::warning::Hand model download failed, using the older hand engine instead"
            rm -f www/mediapipe/tasks/hand_landmarker.task
            find node_modules/@mediapipe/hands -maxdepth 1 -type f ! -name '*.md' -exec cp {} www/mediapipe/hands/ \;
          fi
      - name: Stamp offline cache version
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/" www/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
